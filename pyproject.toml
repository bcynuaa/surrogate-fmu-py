[project]
name = "surrogate-fmu-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chenyubao", email = "chenyu.bao@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "onnx>=1.16",
    "onnxscript>=0.7.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skl2onnx>=1.20.0",
    "torch>=2.15.0",
]

[project.scripts]
surrogate-fmu-py = "surrogate_fmu_py:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
